services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://waldo:waldo@db:5432/waldo?schema=public
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: waldo
      POSTGRES_PASSWORD: waldo
      POSTGRES_DB: waldo
    ports:
      - "5432:5432"
    volumes:
      - waldo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waldo -d waldo"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  waldo_pg_data:
